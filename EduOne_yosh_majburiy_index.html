<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EduOne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first app shell, scrolling screen + fixed bottom tab bar; indigo→violet brand from the user's mockups */
:root{
  --bg:#F3F5FC; --card:#FFFFFF; --ink:#141A3A; --muted:#6B7194; --line:#E4E7F4;
  --brand:#3B5BFD; --violet:#6C4CF1; --soft:#ECEFFF; --softv:#F1ECFF;
  --ok:#1FA45B; --okbg:#E7F7EE; --bad:#E5484D; --badbg:#FDECEC; --warn:#F2A20C; --warnbg:#FFF5E1;
  --display:"Plus Jakarta Sans",system-ui,sans-serif; --body:"Manrope",system-ui,sans-serif;
  --shadow:0 6px 20px rgba(40,50,120,.08);
}
@media (prefers-color-scheme:dark){:root[data-theme="dark"]{
  --bg:#0E1124; --card:#181C36; --ink:#EEF0FF; --muted:#9AA0C4; --line:#2A2F52;
  --brand:#6E86FF; --violet:#9277FF; --soft:#222A55; --softv:#2A2457;
  --ok:#3CCB7F; --okbg:#173527; --bad:#FF6B70; --badbg:#3A1C22; --warn:#FFC046; --warnbg:#3A2E14;
  --shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1124; --card:#181C36; --ink:#EEF0FF; --muted:#9AA0C4; --line:#2A2F52;
  --brand:#6E86FF; --violet:#9277FF; --soft:#222A55; --softv:#2A2457;
  --ok:#3CCB7F; --okbg:#173527; --bad:#FF6B70; --badbg:#3A1C22; --warn:#FFC046; --warnbg:#3A2E14;
  --shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark}
html,body{height:100%}
body{background:#2563EB linear-gradient(135deg,#2563EB,#6941D9) fixed;color:var(--ink);font-family:var(--body);font-size:14px;-webkit-tap-highlight-color:transparent;transition:background .22s ease,color .22s ease}
:root[data-theme="dark"] body{background:#080E22 linear-gradient(145deg,#09142B 0%,#162342 52%,#211B3E 100%) fixed}
:root[data-theme="dark"] .hero{background:linear-gradient(115deg,#283D80 0%,#402A7A 100%)}
:root[data-theme="dark"] .tabs{box-shadow:0 -3px 22px rgba(0,0,0,.24)}
:root[data-theme="dark"] .edu-home-icon{background:#F8FAFF}
:root[data-theme="dark"] .stat,:root[data-theme="dark"] .mini,:root[data-theme="dark"] .li,:root[data-theme="dark"] .card,:root[data-theme="dark"] .lang{border:1px solid #323A62}
:root[data-theme="dark"] .ring>div{background:var(--card)}

*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.app{max-width:480px;margin:0 auto;min-height:100%;position:relative}
.scr{padding:12px 16px 110px;display:flex;flex-direction:column;gap:14px}
.scr.nonav{padding-bottom:28px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.top h2{font-size:18px;flex:1;text-align:center}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.ib:active{background:var(--soft)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px}
.sp{justify-content:space-between}
.muted{color:var(--muted)}
.sm{font-size:12px}
.b{font-weight:700}
.sec{display:flex;justify-content:space-between;align-items:center}
.sec h3{font-size:16px}
.link{color:var(--brand);font-weight:600;font-size:12.5px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:14px;background:linear-gradient(90deg,var(--brand),var(--violet));color:#fff;font-weight:700;font-size:15px;width:100%}
.btn.ghost{background:var(--soft);color:var(--brand)}
.btn.out{background:transparent;border:1.5px solid var(--brand);color:var(--brand)}
.btn:disabled{opacity:.45}
.bar{height:7px;border-radius:9px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:9px;background:var(--c,var(--ok))}
.tile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.hero{border-radius:20px;padding:18px;color:#fff;background:linear-gradient(120deg,var(--brand),var(--violet));position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .bar{background:rgba(255,255,255,.25)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;font-size:11.5px;font-weight:700}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);padding:6px 0;font-weight:600}
.tabs button.on{color:var(--brand)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border-radius:14px;padding:12px 6px;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:4px}
.stat b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.stat span{font-size:10.5px;color:var(--muted);line-height:1.2}
.hs{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.mini{flex:none;width:92px;background:var(--card);border-radius:14px;padding:12px 8px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.mini .t{font-weight:700;font-size:12px}
.list{display:flex;flex-direction:column;gap:10px}
.li{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow);width:100%;text-align:left}
.li .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:600}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:700}
.inp{height:50px;border-radius:13px;border:1px solid var(--line);background:var(--card);padding:0 14px;width:100%}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;position:relative}
.opt.on{border-color:var(--brand);background:var(--soft);color:var(--brand)}
.lang{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);width:100%;font-weight:700;font-size:15px}
.lang.on{border-color:var(--brand);background:var(--soft)}
.lang .r{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.lang.on .r{background:var(--brand);border-color:var(--brand);color:#fff}
.flag{width:34px;height:24px;border-radius:5px;overflow:hidden;display:flex;flex-direction:column;flex:none;box-shadow:0 0 0 1px var(--line)}
.flag i{flex:1}
.ans{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);text-align:left;width:100%}
.ans .k{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.ans.on{border-color:var(--brand);background:var(--soft)}
.ans.on .k{background:var(--brand);border-color:var(--brand);color:#fff}
.qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;justify-items:center}
.qn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.qn.done{background:var(--ok);border-color:var(--ok);color:#fff}
.qn.mark{background:var(--warn);border-color:var(--warn);color:#fff}
.qn.cur{box-shadow:0 0 0 3px var(--violet)}
.ring{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring>div{width:94px;height:94px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center}
.ring b{font-family:var(--display);font-size:26px}
.big{font-family:var(--display);font-size:46px;font-weight:800;color:var(--ok);font-variant-numeric:tabular-nums}
.tag{padding:6px 12px;border-radius:99px;font-size:12px;font-weight:600}
.msgs{display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:11px 14px;border-radius:16px;line-height:1.5;font-size:13.5px}
.m.u{align-self:flex-end;background:linear-gradient(90deg,var(--brand),var(--violet));color:#fff;border-bottom-right-radius:4px}
.m.a{align-self:flex-start;background:var(--card);box-shadow:var(--shadow);border-bottom-left-radius:4px}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0}
.send{width:50px;height:50px;border-radius:13px;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.bot{width:64px;height:64px;flex:none}
.toggle{width:46px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:.2s}
.toggle::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on{background:var(--brand)}
.toggle.on::after{left:23px}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:16px}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars i{width:100%;max-width:26px;border-radius:7px 7px 3px 3px;background:linear-gradient(var(--violet),var(--brand))}
.bars span{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;z-index:20;max-width:90%}
.splash{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:40px 16px 28px;gap:20px}
.logo{font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:-.02em}
.logo span{color:var(--brand)}
.dots{display:flex;gap:6px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--brand);width:20px;border-radius:9px}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fade{animation:f .25s ease}
@keyframes f{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.splash .logo,.splash p.muted,.scr>.top,.scr>.sec,.scr>h2,.scr>p.muted{color:white}
.splash .logo span,.scr>.sec .link,.scr>.top .ib{color:#EFF3FF}

/* EduOne: bosh sahifa sarlavhasi uchun kontrast va logotip */
.edu-home-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0 18px}
.edu-home-brand{display:flex;align-items:center;gap:10px;min-width:0}
.edu-home-icon{width:45px;height:45px;flex:0 0 45px;border-radius:13px;background:#fff;display:grid;place-items:center;padding:3px;box-shadow:0 5px 18px rgba(12,23,92,.2)}
.edu-home-icon img{width:100%;height:100%;object-fit:contain;border-radius:10px}
.edu-home-name{font-family:var(--display);font-size:clamp(24px,7vw,32px);font-weight:850;letter-spacing:-.035em;color:#fff;white-space:nowrap;line-height:1.1;text-shadow:0 1px 3px rgba(20,30,100,.16)}
.edu-home-name span{color:#fff}
.edu-home-top+.row h2{color:#fff}
.edu-home-top+.row p.muted{color:#eef2ff;opacity:1}
@media(max-width:350px){.edu-home-icon{width:38px;height:38px;flex-basis:38px}.edu-home-brand{gap:7px}.edu-home-name{font-size:24px}}

/* Profile image picker */
.avatar-pick{width:70px;height:70px;flex:none;position:relative;z-index:2;border-radius:50%;background:rgba(255,255,255,.24);display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:26px;font-weight:800;border:2px solid rgba(255,255,255,.55);padding:0;overflow:visible}
.avatar-pick .avatar-photo{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.avatar-camera{position:absolute;right:-5px;bottom:-4px;width:26px;height:26px;border-radius:50%;background:#fff;color:#365af4;display:grid;place-items:center;box-shadow:0 2px 8px #15246955;border:2px solid #e9edff}
.avatar-camera svg{width:14px;height:14px}
.avatar-upload-note{font-size:11px;color:#fff;opacity:.85;margin-top:5px}

/* Premium image crop editor */
#edu-crop-modal{position:fixed;inset:0;z-index:9999;background:rgba(9,14,35,.78);display:flex;align-items:center;justify-content:center;padding:18px}
.crop-card{background:var(--card);color:var(--ink);width:min(100%,390px);border-radius:22px;padding:20px;box-shadow:0 20px 70px #0005}
.crop-card h3{text-align:center;font-size:20px}.crop-card p{text-align:center;color:var(--muted);font-size:13px;margin:8px 0 15px}
.crop-stage{position:relative;max-width:320px;margin:auto;aspect-ratio:1;overflow:hidden;border-radius:16px;background:#1b203a;touch-action:none}
.crop-stage canvas{width:100%;height:100%;display:block;touch-action:none}
.crop-ring{position:absolute;inset:0;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 60px #0005;pointer-events:none}
.crop-card label{display:block;margin-top:16px;font-size:13px;font-weight:700}.crop-card input[type=range]{width:100%;accent-color:var(--brand);margin:10px 0}
.crop-actions{display:flex;gap:10px}.crop-actions button{flex:1;border-radius:12px;padding:13px 8px;background:var(--soft);font-weight:700;color:var(--ink)}
.crop-actions #crop-save{background:var(--brand);color:white}
.flag{background:#fff}.flag svg{display:block;flex:none}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}

/* V2: bayroqlar haqiqiy besh qirrali yulduzlar bilan chiziladi. */
.flag{width:44px;height:26px;flex:0 0 44px;border-radius:5px;overflow:hidden;display:block;box-shadow:0 0 0 1px rgba(120,132,167,.26);background:white}
.flag svg{width:100%;height:100%;display:block}
/* Light / dark rejimlari barcha sahifalarda aniq farqlanadi. */
.theme-icon{color:#fff!important;border:1px solid rgba(255,255,255,.38);background:rgba(255,255,255,.12);border-radius:50%;width:42px;height:42px}
.theme-icon svg{width:25px;height:25px}
:root[data-theme="dark"] .theme-icon{background:rgba(235,243,255,.16)}
:root[data-theme="dark"] .lang.on{background:#28365F;color:#f6f8ff;border-color:#8195FF}
:root[data-theme="dark"] .btn.ghost{color:#D2DCFF}
:root[data-theme="dark"] .muted{color:#B0B8D4}
:root[data-theme="dark"] .splash p.muted,:root[data-theme="dark"] .scr>p.muted{color:#E4E9FF}
.scr:has(.lang) > div:first-child h1{color:#fff}
.scr:has(.lang) > div:first-child h1 span{color:#EFF3FF!important}
.scr:has(.lang) > div:first-child p.muted{color:#ECF0FF}
.scr:has(.lang) > p.muted{color:#ECF0FF}
/* Avatar is one and the same square crop, resized inside circular frames. */
.home-avatar{width:46px;height:46px;flex:0 0 46px;border:2px solid rgba(255,255,255,.95);border-radius:50%;overflow:hidden;display:grid;place-items:center;padding:0;background:var(--soft);color:var(--brand);font-size:18px;font-weight:800;line-height:1;box-shadow:0 2px 8px rgba(14,21,80,.17)}
.home-avatar .avatar-image{width:100%;height:100%;object-fit:cover;object-position:center center;border-radius:50%;display:block}
.avatar-pick .avatar-photo{width:100%;height:100%;object-fit:cover;object-position:center center;border-radius:50%}
.avatar-realign{background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.5);color:#fff;padding:6px 12px;border-radius:99px;font-size:11px;font-weight:700;margin-top:8px;position:relative;z-index:2}
.avatar-realign:active{background:rgba(255,255,255,.28)}
.crop-stage{cursor:grab}
.crop-stage:active{cursor:grabbing}
.crop-stage .crop-ring{border:3px solid #fff;box-shadow:0 0 0 160px rgba(5,8,19,.45);inset:0;border-radius:50%}
.crop-card input[type=range]{background:var(--card)}
</style>
<style id="eduone-admin-style">
.ad-hero{background:linear-gradient(125deg,#172b65,#5144ba 65%,#7b55d7);color:#fff;padding:23px;border-radius:24px;box-shadow:0 16px 36px #283f9140;position:relative;overflow:hidden}.ad-hero:after{content:"✦";position:absolute;right:17px;top:0;font-size:100px;opacity:.12}.ad-hero h2{color:#fff;font-size:25px;margin:8px 0}.ad-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.ad-kpi{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:0 4px 14px #00000009}.ad-kpi b{font-size:25px;display:block;margin-top:6px}.ad-kpi small{color:var(--muted)}.ad-tabs{display:flex;overflow-x:auto;gap:8px;padding:5px 0 10px;scrollbar-width:none}.ad-tabs button{white-space:nowrap;padding:11px 14px;border-radius:13px;background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:700}.ad-tabs button.active{background:#5144ba;color:#fff;border-color:#5144ba}.ad-form{display:grid;gap:12px}.ad-form label{font-size:12px;font-weight:700;display:grid;gap:5px;color:var(--ink)}.ad-form input,.ad-form select,.ad-form textarea,.ad-search{width:100%;min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:12px;font:inherit;box-sizing:border-box}.ad-form textarea{min-height:90px}.ad-entry{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.ad-entry:last-child{border:0}.ad-entry-main{flex:1;min-width:0}.ad-entry-main b{display:block;overflow-wrap:anywhere}.ad-entry-main small{display:block;color:var(--muted);margin-top:5px;overflow-wrap:anywhere}.ad-mini{border:1px solid var(--line);border-radius:9px;background:var(--soft);color:var(--ink);padding:8px;font-size:12px;font-weight:700}.ad-danger{color:#d33a4d!important}.ad-note{border-left:3px solid #6d5ce6;background:var(--soft);border-radius:10px;padding:12px;font-size:13px;line-height:1.6}.ad-actions{display:flex;gap:8px;flex-wrap:wrap}.ad-empty{text-align:center;color:var(--muted);padding:26px 10px}.ad-badge{font-size:11px;border-radius:30px;padding:5px 9px;background:#dfeee9;color:#12654b;font-weight:800}
</style>
</head>
<body>

<div class="app" id="app"></div>
<nav class="tabs" id="tabs" hidden><div class="in" id="tabsIn"></div></nav>

<script>
/* ---------- icons ---------- */
const P={
camera:'<rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="12" cy="13" r="3"/><path d="M8 7l1.5-3h5L16 7"/>',
home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
book:'<path d="M2 5h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2zM22 5h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/>',
globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
bot:'<rect x="4" y="8" width="16" height="12" rx="4"/><path d="M12 8V4M9 14h.01M15 14h.01"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',

let cropState=null;
function closeCrop(){const modal=document.getElementById('edu-crop-modal');if(modal)modal.remove();cropState=null;}
function paintCrop(){
 if(!cropState)return;
 const c=cropState,ctx=c.canvas.getContext('2d');
 const scale=Math.max(320/c.img.width,320/c.img.height)*c.zoom;
 const w=c.img.width*scale,h=c.img.height*scale;
 c.offsetX=Math.max(-(w-320)/2,Math.min((w-320)/2,c.offsetX));
 c.offsetY=Math.max(-(h-320)/2,Math.min((h-320)/2,c.offsetY));
 ctx.clearRect(0,0,320,320);
 ctx.drawImage(c.img,(320-w)/2+c.offsetX,(320-h)/2+c.offsetY,w,h);
}
async function avatarChoose(file){
 let sourceUrl='';let tempUrl='';
 if(file){
  if(!file.type.startsWith('image/')){toast('Faqat rasm tanlang');return}
  if(file.size>12*1024*1024){toast('Rasm 12 MB dan kichik bo‘lsin');return}
  tempUrl=URL.createObjectURL(file);sourceUrl=tempUrl;
 }else{
  // Avval saqlangan suratni qayta qirqish mumkin. Galereyadagi asl surat sifatliroq.
  try{sourceUrl=localStorage.getItem(avatarLocalKey())||''}catch(e){}
  if(!sourceUrl){$('#avatar-file')?.click();return}
 }
 try{
  const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{if(tempUrl)URL.revokeObjectURL(tempUrl);resolve(im)};im.onerror=()=>{if(tempUrl)URL.revokeObjectURL(tempUrl);reject(new Error('Rasm ochilmadi'))};im.src=sourceUrl});
  closeCrop();
  const modal=document.createElement('div');modal.id='edu-crop-modal';modal.innerHTML=`<div class="crop-card" role="dialog" aria-modal="true" aria-label="Profil rasmini qirqish"><h3>Profil rasmini moslash</h3><p>Rasmni suring va kattalashtiring</p><div class="crop-stage"><canvas id="crop-canvas" width="320" height="320"></canvas><div class="crop-ring"></div></div><label for="crop-zoom">Kattalashtirish</label><input id="crop-zoom" type="range" min="1" max="3" step="0.01" value="1"><div class="crop-actions"><button id="crop-cancel" type="button">Bekor qilish</button><button id="crop-save" type="button">Saqlash</button></div></div>`;
  document.body.appendChild(modal);
  const canvas=modal.querySelector('canvas');cropState={img,canvas,zoom:1,offsetX:0,offsetY:0};paintCrop();
  let drag=null;
  canvas.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)};
  canvas.onpointermove=e=>{if(!drag||!cropState)return;const r=canvas.getBoundingClientRect();cropState.offsetX+=(e.clientX-drag.x)*320/r.width;cropState.offsetY+=(e.clientY-drag.y)*320/r.height;drag={x:e.clientX,y:e.clientY};paintCrop()};
  canvas.onpointerup=canvas.onpointercancel=()=>{drag=null};
  // Drag beyond image edges is prevented in paintCrop().
  modal.querySelector('#crop-zoom').oninput=e=>{cropState.zoom=Number(e.target.value);paintCrop()};
  modal.querySelector('#crop-cancel').onclick=closeCrop;
  modal.onclick=e=>{if(e.target===modal)closeCrop()};
  modal.querySelector('#crop-save').onclick=async()=>{
   if(!cropState)return;
   const finalCanvas=cropState.canvas;
   const blob=await new Promise(resolve=>finalCanvas.toBlob(resolve,'image/jpeg',.85));
   if(!blob){toast('Rasmni saqlab bo‘lmadi');return}
   const dataUrl=finalCanvas.toDataURL('image/jpeg',.85);
   closeCrop();
   const btn=$('#avatar-btn');if(btn)btn.disabled=true;
   try{
  S.avatarPreview=dataUrl;
  try{localStorage.setItem(avatarLocalKey(),dataUrl)}catch(e){}
  render();
  // A private 'avatars' bucket and per-user storage policies are required in Supabase.
  if(!verified?.id || !client?.storage){toast('Rasm shu qurilmada saqlandi');return}
  const path=verified.id+'/profile.jpg';
  const {error:uploadError}=await client.storage.from('avatars').upload(path,blob,{contentType:'image/jpeg',upsert:true,cacheControl:'60'});
  if(uploadError){toast('Rasm shu qurilmada saqlandi. Bulutli saqlash sozlanmagan.');return}
  const {error:metaError}=await client.auth.updateUser({data:{avatar_path:path}});
  if(metaError){toast('Rasm yuklandi, lekin profilga bog‘lanmadi');return}
  // Signed URLs work with a private bucket. Refresh when a new session starts.
  const {data:signed,error:signError}=await client.storage.from('avatars').createSignedUrl(path,3600);
  if(!signError&&signed?.signedUrl){S.user.avatar_url=signed.signedUrl;S.avatarPreview=null;render()}
  toast('Profil rasmi saqlandi');
   }catch(e){toast('Rasmni yuklashda xatolik')}finally{const b=$('#avatar-btn');if(b)b.disabled=false}
  };
 }catch(e){toast('Rasm ochilmadi')}
}

function bindAuth(){
 const form=$('#authForm'), input=$('#credential'), message=$('#authMsg');
 async function submit(resend){
  if(form.dataset.busy)return;
  form.dataset.busy='1'; message.textContent='';
  try{
   if(cur==='phone'||resend){
    if(!resend){
     let digits=input.value.replace(/[ ()+-]/g,'');
     if(/^\d{9}$/.test(digits))digits='998'+digits;
     if(!/^998\d{9}$/.test(digits))throw Error('998 dan keyin 9 ta raqam kiriting.');
     number='+'+digits;
    }
    if(live){
     if(Date.now()<retryAt)throw Error('Qayta yuborishdan oldin bir daqiqa kuting.');
     const {error}=await client.auth.signInWithOtp({phone:number});
     if(error)throw Error('SMS yuborilmadi. Raqam va ulanishni tekshirib, qayta urining.');
     retryAt=Date.now()+60000;
    }
    if(form.isConnected){if(resend)message.textContent='Yangi kod yuborildi.';else go('code')}
   }else{
    const token=input.value.trim();
    if(!/^\d{6}$/.test(token))throw Error('6 xonali kodni kiriting.');
    if(!live){
     message.textContent=token==='123456'?'Sinov muvaffaqiyatli. Haqiqiy profilga kirish uchun SMS xizmati ulanishi kerak.':'Sinov kodi noto‘g‘ri.';
     return;
    }
    const {data,error}=await client.auth.verifyOtp({phone:number,token,type:'sms'});
    if(error||!data.user)throw Error('Kod noto‘g‘ri yoki muddati tugagan.');
    startAccount(data.user);
   }
  }catch(error){message.textContent=error.message}
  finally{delete form.dataset.busy}
 }
 form.onsubmit=e=>{e.preventDefault();submit(false)};
 if($('#again'))$('#again').onclick=()=>submit(true);
}

function startTest(){T={i:0,ans:Array(Q.length).fill(null),mark:Array(Q.length).fill(false),left:TOTAL_TIME};clearInterval(timerId);timerId=setInterval(()=>{if(cur!=='test'){return}T.left--;const el=$('#tm');if(el){const mm=String(Math.floor(T.left/60)).padStart(2,'0'),ss=String(T.left%60).padStart(2,'0');el.innerHTML=ic('clock',18)+mm+':'+ss}if(T.left<=0)finish()},1000)}
function finish(){clearInterval(timerId);let ok=0,bad=0,skip=0,wrong=[],tp={};Q.forEach((q,k)=>{const a=T.ans[k];tp[q.t]=tp[q.t]||{t:q.t,bad:0};if(a==null){skip++;tp[q.t].bad++;wrong.push({k,a})}else if(a===q.c)ok++;else{bad++;tp[q.t].bad++;wrong.push({k,a})}});
 S.last={ok,bad,skip,n:Q.length,time:TOTAL_TIME-T.left,topics:Object.values(tp),wrong};S.xp+=ok*10;S.tests++;store.set('last',S.last);store.set('xp',S.xp);store.set('tests',S.tests);T=null;cur='natija';stack=['home'];render()}
function render(){

}

  $('#rf').onsubmit=async e=>{e.preventDefault();sync();const er=$('#err');const digits=d.phone.replace(/\D/g,'');const age=+d.age;
   const msg=(d.phone && digits.length!==12)?"Telefon raqamni to'liq kiriting: +998 va 9 ta raqam.":!d.reg?'Viloyatni tanlang.':!d.tuman?'Tuman yoki shaharni tanlang.':d.name.trim().split(/\s+/).length<2?'Ism va familiyani birga kiriting.':!(age>=7&&age<=90)?'Yoshni 7 dan 90 gacha raqam bilan kiriting.':'';
   if(msg){er.textContent=msg;er.hidden=false;return}const button=e.target.querySelector('[type=submit]');button.disabled=true;

    const {error:dbError}=await client.from('edu_profiles').upsert({
      id:verified.id,first_name,last_name,gender:profile.gen,
      user_type:profile.role,region:profile.reg,district:profile.tuman,
      age:Number(profile.age)
    },{onConflict:'id'});
    if(dbError)throw dbError;
    // Keep the existing EduOne profile model (including age) for UI compatibility.
    const {data:authData,error:authError}=await client.auth.updateUser({data:{eduone:profile}});
    if(authError)throw authError;
    if(authData?.user)verified=authData.user;
   }catch(error){
    console.error('EduOne profile save:',error);
    button.disabled=false;er.hidden=false;

Object.assign(KK_UI,EDU_UI_CORRECTIONS.kk);
Object.assign(RU_UI,EDU_UI_CORRECTIONS.ru);
const KK_KEYS=Object.keys(KK_UI).sort((a,b)=>b.length-a.length);
const EN_KEYS=Object.keys(EN_UI).sort((a,b)=>b.length-a.length);
const RU_KEYS=Object.keys(RU_UI).sort((a,b)=>b.length-a.length);
function eduTranslateText(input,lang){
 const dict=lang==='kk'?KK_UI:lang==='en'?EN_UI:RU_UI;
 const keys=lang==='kk'?KK_KEYS:lang==='en'?EN_KEYS:RU_KEYS;
 if(typeof input!=='string'||!input.trim())return input;
 const trimmed=input.trim();
 if(dict[trimmed])return input.replace(trimmed,dict[trimmed]);
 let result=input;
 for(const key of keys){
  if(key.length<5)continue;
  if(result.includes(key))result=result.split(key).join(dict[key]);
 }
 return result;
}
function applyEduLanguage(){
 const lang=typeof S!=='undefined'?S.lang:'uz';
 document.documentElement.lang=lang==='ru'?'ru':lang==='en'?'en':lang==='kk'?'kaa':'uz';
 if(lang!=='ru'&&lang!=='en'&&lang!=='kk')return;
 const root=document.getElementById('app')||document.body;
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 for(const node of nodes){
  if(node.parentElement?.closest('script,style,textarea,[contenteditable]'))continue;
  node.nodeValue=eduTranslateText(node.nodeValue,lang);
 }
 root.querySelectorAll('[placeholder],[aria-label],[title],[data-toast]').forEach(el=>{
  for(const a of ['placeholder','aria-label','title','data-toast'])if(el.hasAttribute(a))el.setAttribute(a,eduTranslateText(el.getAttribute(a),lang));
 });
}


/* EduOne public catalog: published records are loaded from Supabase. */
const eduCatalog={subjects:[],lessons:[],books:[],quizzes:[],announcements:[],selected:null,ready:false,error:''};
const eduCatalogTypes=['subjects','lessons','books','quizzes','announcements'];
async function eduRefreshCatalog(silent=false){
 if(!client||!verified)return;
 try{
  const results=await Promise.all(eduCatalogTypes.map(t=>client.from('edu_'+t).select('*').eq('is_published',true).limit(500)));
  for(let i=0;i<results.length;i++){if(results[i].error)throw results[i].error;eduCatalog[eduCatalogTypes[i]]=results[i].data||[];}
  eduCatalog.ready=true;eduCatalog.error='';
  if(['fanlar','home','edu-subject','edu-test-categories','edu-test-list','edu-lesson','edu-book','edu-quiz'].includes(cur))render();
 }catch(e){eduCatalog.error=e.message;if(!silent)toast('Kontent yuklanmadi: '+e.message);}
}
function eduVisibleSubjects(){
 const built=SUBJ.map(x=>({...x,remote:eduCatalog.subjects.find(r=>r.slug===({'mat':'matematika','fiz':'fizika','kim':'kimyo','geo':'geografiya','tar':'tarix','inf':'informatika','ona':'ona-tili','bio':'biologiya'}[x.id]))}));
 const slugs=new Set(built.map(x=>x.remote?.slug).filter(Boolean));
 return built.concat(eduCatalog.subjects.filter(r=>!slugs.has(r.slug)).map(r=>({id:'db:'+r.id,n:r.title,d:eduCatalog.lessons.filter(l=>l.subject_id===r.id).length,p:0,c:'#6556E8',i:'book',cat:'all',remote:r})));
}

function eduQuizCategory(q){

/* Student quiz: correct answers never fetched with questions. Server RPC grades responses. */
const eduQuizState={id:null,questions:[],answers:{},busy:false,finished:null,error:'',current:0};
function eduQuizView(x){
 if(eduQuizState.id!==x.id){eduQuizState.id=x.id;eduQuizState.questions=[];eduQuizState.answers={};eduQuizState.finished=null;eduQuizState.error='';}
 if(eduQuizState.finished){const r=eduQuizState.finished;return `<div class="card"><h2>📊 Test natijasi</h2><h2>${r.correct_count} / ${r.total_questions}</h2><p>To‘g‘ri: ${r.correct_count} ta · Noto‘g‘ri yoki belgilanmagan: ${r.total_questions-r.correct_count} ta</p><p>Natija: ${Math.round(100*r.correct_count/Math.max(1,r.total_questions))}%</p>${(r.details||[]).map(d=>`<div style="padding:12px 0;border-top:1px solid #ddd"><b>${d.number}-savol</b> · Siz: ${esc(d.selected||'—')} · To‘g‘ri: ${esc(d.correct)} ${d.is_correct?'✅':'❌'}</div>`).join('')}<button class="btn" id="edu-quiz-retry">Qayta ishlash</button></div>`;}
 if(eduQuizState.error)return `<div class="card"><p>${esc(eduQuizState.error)}</p><button class="btn" id="edu-quiz-load">Qayta urinish</button></div>`;
 if(!eduQuizState.questions.length)return `<div class="card"><p>Testni boshlash uchun savollarni yuklang.</p><button class="btn" id="edu-quiz-load">▶ Testni boshlash</button></div>`;
 const count=eduQuizState.questions.length;
 const i=Math.min(Math.max(eduQuizState.current,0),count-1);const q=eduQuizState.questions[i];
 return `<div class="card"><p><b>${count} ta savol</b> · Belgilangan: ${Object.keys(eduQuizState.answers).length}</p>
 <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:16px 0">${eduQuizState.questions.map((v,j)=>`<button type="button" data-edu-jump="${j}" style="min-height:46px;border-radius:12px;font-weight:800;border:2px solid ${j===i?'#6556E8':'#e2e4f0'};background:${j===i?'#e8e5ff':eduQuizState.answers[v.id]?'#dcfce7':'#f7f8fc'};color:#222">${j+1}</button>`).join('')}</div>
 <div style="border-top:1px solid #ddd;padding:16px 0"><h3>${i+1}. ${esc(q.question)}</h3>${['A','B','C','D'].map(k=>`<label style="display:flex;align-items:flex-start;gap:10px;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:12px;cursor:pointer"><input type="radio" name="edu-q-${i}" data-edu-answer="${esc(q.id)}" value="${k}" ${eduQuizState.answers[q.id]===k?'checked':''}><span><b>${k})</b> ${esc(q['option_'+k.toLowerCase()])}</span></label>`).join('')}</div>
 <div style="display:flex;gap:10px;margin-bottom:14px"><button type="button" class="btn out" style="flex:1" data-edu-jump="${i-1}" ${i===0?'disabled':''}>← Oldingi</button><button type="button" class="btn" style="flex:1" data-edu-jump="${i+1}" ${i===count-1?'disabled':''}>Keyingi →</button></div>
 <button class="btn" id="edu-quiz-finish" ${eduQuizState.busy?'disabled':''}>${eduQuizState.busy?'Tekshirilmoqda...':'Testni yakunlash'}</button></div>`;
}
async function eduQuizLoad(){
 if(!client||!verified){toast('Avval hisobingizga kiring');return;}
 try{eduQuizState.error='';const {data,error}=await client.rpc('eduone_get_quiz_questions',{p_quiz_id:eduQuizState.id});if(error)throw error;eduQuizState.questions=data||[];eduQuizState.answers={};eduQuizState.current=0;eduQuizState.finished=null;render();}
 catch(e){eduQuizState.error='Savollarni yuklab bo‘lmadi: '+e.message;render();}
}
async function eduQuizFinish(){
 if(eduQuizState.busy)return;
 if(!confirm('Testni yakunlab, natijani ko‘rasizmi?'))return;
 eduQuizState.busy=true;render();
 try{const {data,error}=await client.rpc('eduone_grade_quiz',{p_quiz_id:eduQuizState.id,p_answers:eduQuizState.answers});if(error)throw error;eduQuizState.finished=data;render();}
 catch(e){toast('Natija xatosi: '+e.message);eduQuizState.busy=false;render();}
 finally{eduQuizState.busy=false;}
}
document.addEventListener('change',e=>{if(e.target.matches('[data-edu-answer]'))eduQuizState.answers[e.target.dataset.eduAnswer]=e.target.value;});
document.addEventListener('click',e=>{
 const cat=e.target.closest('[data-edu-category]');if(cat){eduSelectedTestCategory=cat.dataset.eduCategory;go('edu-test-list');return;}
 const jump=e.target.closest('[data-edu-jump]');if(jump){const n=Number(jump.dataset.eduJump);if(n>=0&&n<eduQuizState.questions.length){eduQuizState.current=n;render();}return;}
 if(e.target.closest('#edu-quiz-load'))eduQuizLoad();
 if(e.target.closest('#edu-quiz-finish'))eduQuizFinish();
 if(e.target.closest('#edu-quiz-retry')){eduQuizState.finished=null;eduQuizState.questions=[];eduQuizState.answers={};eduQuizLoad();}
});
V['edu-test-categories']=eduTestCategoriesView;V['edu-test-list']=eduTestListView;V['edu-subject']=eduSubjectDetail;V['edu-lesson']=eduItemDetail;V['edu-book']=eduItemDetail;V['edu-quiz']=eduItemDetail;
window.addEventListener('focus',()=>{if(verified)eduRefreshCatalog(true)});
setInterval(()=>{if(!document.hidden&&verified&&['home','fanlar','edu-subject'].includes(cur))eduRefreshCatalog(true)},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&verified)eduRefreshCatalog(true)});

/* EduOne Admin Studio: privileges are checked in Supabase, never in client metadata. */
const adminState={allowed:false,tab:'dashboard',rows:{},loading:false,editing:null,search:'',importData:null,importBusy:false};
const adminDefs={
 subjects:{title:'Fanlar',icon:'📚',fields:[['title','Fan nomi','text',true],['slug','Qisqa kod (masalan geografiya)','text',true],['description','Tavsif','textarea'],['sort_order','Tartib raqami','number'],['is_published','Nashr qilingan','checkbox']]},
 lessons:{title:'Video darslar',icon:'🎬',fields:[['title','Dars nomi','text',true],['subject_id','Fan','subject'],['description','Dars tavsifi','textarea'],['video_url','Video havolasi (HTTPS)','url'],['sort_order','Tartib raqami','number'],['is_published','Nashr qilingan','checkbox']]},
 books:{title:'PDF kutubxona',icon:'📖',fields:[['title','Kitob nomi','text',true],['subject_id','Fan','subject'],['description','Kitob tavsifi','textarea'],['file_path','PDF fayl yo‘li','text'],['is_published','Nashr qilingan','checkbox']]},
 quizzes:{title:'Test to‘plamlari',icon:'📝',fields:[['title','Test nomi','text',true],['subject_id','Fan','subject'],['description','Tavsif','textarea'],['time_limit','Vaqt (daqiqa)','number'],['is_published','Nashr qilingan','checkbox']]},
 questions:{title:'Savollar',icon:'❓',fields:[['quiz_id','Test to‘plami','quiz'],['question','Savol matni','textarea',true],['option_a','A variant','text',true],['option_b','B variant','text',true],['option_c','C variant','text',true],['option_d','D variant','text',true],['correct_option','To‘g‘ri javob','answer'],['explanation','Izoh','textarea'],['sort_order','Tartib raqami','number']]},
 subscriptions:{title:'Obunalar',icon:'💎',fields:[['user_id','Foydalanuvchi UUID','text',true],['subject_id','Fan (bo‘sh = barcha fanlar)','subject_optional'],['plan','Tarif','plan'],['status','Holat','status'],['starts_at','Boshlanish vaqti','datetime-local'],['expires_at','Tugash vaqti','datetime-local']]},
 announcements:{title:'E’lonlar',icon:'📣',fields:[['title','Sarlavha','text',true],['body','Xabar matni','textarea',true],['is_published','Nashr qilingan','checkbox']]}
};
async function adminCheck(user){
 adminState.allowed=false;
 if(!client||!user?.id)return;
 try{const {data,error}=await client.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();
 if(error)throw error;adminState.allowed=!!data;
 if(cur==='profil')render();
  eduRefreshCatalog(true);
 }catch(e){console.warn('Admin tekshiruvi:',e.message)}
}
const adminDate=v=>v?new Date(v).toLocaleDateString('uz-UZ'): '—';
const adminSafe=v=>esc(v==null?'':v);
const adminName=(type,id)=>adminState.rows[type]?.find(x=>x.id===id)?.title||id||'—';
const adminFields=(table,row={})=>adminDefs[table].fields.map(([key,label,type,required])=>{
 let v=row[key]??'';
 if(type==='checkbox')return `<label style="display:flex;align-items:center;gap:9px"><input style="width:18px;height:18px" name="${key}" type="checkbox" ${v?'checked':''}>${label}</label>`;
 if(type==='subject'||type==='subject_optional'||type==='quiz'){
  const list=adminState.rows[type==='quiz'?'quizzes':'subjects']||[];
  return `<label>${label}<select name="${key}" ${type==='subject_optional'?'':'required'}><option value="">${type==='subject_optional'?'Barcha fanlar':'Tanlang'}</option>${list.map(x=>`<option value="${adminSafe(x.id)}" ${x.id===v?'selected':''}>${adminSafe(x.title)}</option>`).join('')}</select></label>`;
 }
 if(type==='answer'||type==='plan'||type==='status'){
  const vals=type==='answer'?['A','B','C','D']:type==='plan'?['premium','subject']:['active','pending','expired','cancelled'];
  return `<label>${label}<select name="${key}">${vals.map(x=>`<option value="${x}" ${x===(v||vals[0])?'selected':''}>${x}</option>`).join('')}</select></label>`;
 }
 if(type==='textarea')return `<label>${label}<textarea name="${key}" ${required?'required':''}>${adminSafe(v)}</textarea></label>`;
 if(type==='datetime-local'&&v)v=String(v).slice(0,16);
 return `<label>${label}<input name="${key}" type="${type}" value="${adminSafe(v)}" ${required?'required':''} ${type==='number'?'min="0"':''}></label>`;
}).join('');
function adminView(){
 const tab=adminState.tab,def=adminDefs[tab],rows=adminState.rows[tab]||[];
 return `<div class="scr fade">${topbar('Admin Studio')}<div class="ad-hero"><div style="font-size:12px;letter-spacing:2px;font-weight:800;opacity:.85">EDUONE • CONTROL CENTER</div><h2>Ta’lim platformasi<br>boshqaruvi</h2><div class="sm" style="opacity:.85">Administrator • ${adminSafe(S.user?.name||'EduOne')}</div></div>
 <div class="ad-tabs"><button data-ad-tab="dashboard" class="${tab==='dashboard'?'active':''}">📊 Umumiy</button>${Object.entries(adminDefs).map(([k,d])=>`<button data-ad-tab="${k}" class="${tab===k?'active':''}">${d.icon} ${d.title}</button>`).join('')}</div>
 ${tab==='dashboard'?`<div class="ad-kpis">${Object.entries(adminDefs).map(([k,d])=>`<button class="ad-kpi" data-ad-tab="${k}" style="text-align:left"><small>${d.icon} ${d.title}</small><b>${adminState.rows[k]?.length??'—'}</b><small>Ma’lumotlar bazasi</small></button>`).join('')}</div><div class="card"><h3>Tezkor boshqaruv</h3><p class="sm muted">Fan yarating, unga video darslar, PDF kitoblar va testlarni bog‘lang. Obunalarni foydalanuvchi UUID orqali boshqaring.</p><div class="ad-actions"><button class="btn" data-ad-tab="subjects">+ Fan qo‘shish</button><button class="ad-mini" data-ad-refresh>↻ Yangilash</button></div></div><div class="ad-note">🔒 Barcha yozish/o‘chirish amallari Supabase RLS orqali faqat administratorlarga ruxsat etiladi. Panel faqat haqiqiy kirgan admin uchun ochiladi.</div>`:
 `<div class="card"><div class="row sp"><div><b style="font-size:19px">${def.icon} ${def.title}</b><div class="sm muted">${rows.length} ta yozuv</div></div><button class="ad-mini" data-ad-refresh>↻</button></div><input class="ad-search" id="ad-search" placeholder="🔎 Qidirish..." value="${adminSafe(adminState.search)}" style="margin:12px 0"><button class="btn" data-ad-new>+ Yangi qo‘shish</button></div>
 ${adminState.editing?.table===tab?`<form id="ad-form" class="card ad-form"><div class="row sp"><b>${adminState.editing.id?'Tahrirlash':'Yangi yozuv'}</b><button type="button" class="ad-mini" data-ad-cancel>✕</button></div>${adminFields(tab,adminState.editing.row)}${tab==='books'?`<label>PDF yuklash (ixtiyoriy)<input id="ad-pdf" type="file" accept="application/pdf"></label>`:''}<button class="btn" type="submit">💾 Saqlash</button></form>`:''}
 ${tab==='questions'?`<div class="card ad-form"><b>📥 JSON testlarni ommaviy yuklash</b><p class="sm muted">Faylni tanlang, savollarni tekshiring va Supabase bazasiga saqlang.</p><label>JSON fayl<input type="file" id="ad-import-file" accept=".json,application/json"></label><div id="ad-import-preview">${adminState.importData?adminImportPreview():''}</div></div>`:''}
 <div class="card" id="ad-list">${rows.filter(r=>JSON.stringify(r).toLowerCase().includes(adminState.search.toLowerCase())).map(r=>`<div class="ad-entry"><div class="ad-entry-main"><b>${adminSafe(r.title||r.question||r.user_id||'Yozuv')}</b><small>${adminSafe(r.description||r.body||r.explanation||'')}${r.subject_id?' · '+adminSafe(adminName('subjects',r.subject_id)):''}</small><small>${r.is_published===false?'⚪ Qoralama':r.is_published===true?'🟢 Nashrda':''} ${r.status?' · '+adminSafe(r.status):''} ${r.created_at?' · '+adminDate(r.created_at):''}</small></div><div class="ad-actions"><button class="ad-mini" data-ad-edit="${adminSafe(r.id)}">✎</button><button class="ad-mini ad-danger" data-ad-delete="${adminSafe(r.id)}">🗑</button></div></div>`).join('')||'<div class="ad-empty">Hozircha yozuv yo‘q. Yangi qo‘shing.</div>'}</div>`}
 <p class="sm muted" style="text-align:center">EduOne Admin Studio · Secure by Supabase RLS</p></div>`;
}
V.admin=()=>adminView();
async function adminLoad(){
 if(!adminState.allowed||!client)return;
 adminState.loading=true;
 try{await Promise.all(Object.keys(adminDefs).map(async table=>{
  const {data,error}=await client.from('edu_'+table).select('*').order('created_at',{ascending:false}).limit(300);
  if(error)throw new Error(table+': '+error.message);
  adminState.rows[table]=data||[];
 }));
 }catch(e){toast('Admin bazasi: '+e.message)}finally{adminState.loading=false;if(cur==='admin')render()}
}

function adminImportPreview(){
 const d=adminState.importData;if(!d)return '';
 const subject=(adminState.rows.subjects||[]).find(s=>s.title?.toLowerCase()===(d.subject||'').toLowerCase());
 const quizzes=(adminState.rows.quizzes||[]).filter(q=>!subject||q.subject_id===subject.id);
 return `<div class="ad-note"><b>${adminSafe(d.subject)} · ${adminSafe(d.category)} · ${adminSafe(d.variant)}</b><br>${d.questions.length} savol · ${adminSafe(d.language||'uz')}<br>Javoblar: ${adminSafe(d.questions.map(q=>q.number+'-'+q.correct_answer).join(', '))}</div>
 <label>Test to‘plami<select id="ad-import-quiz"><option value="">+ Yangi to‘plam yaratish</option>${quizzes.map(q=>`<option value="${adminSafe(q.id)}">${adminSafe(q.title)}</option>`).join('')}</select></label>
 <label>Yangi to‘plam nomi<input id="ad-import-title" value="${adminSafe((d.category||'Test')+' — '+(d.variant||'I variant'))}"></label>
 <p class="sm muted">Yangi to‘plam qoralama bo‘ladi. Bir xil faylni qayta yuklamang.</p><button class="btn" id="ad-import-save" ${adminState.importBusy?'disabled':''}>💾 ${d.questions.length} savolni saqlash</button>`;
}
function adminValidateImport(d){
 if(!d||!Array.isArray(d.questions)||!d.questions.length||d.questions.length>500)throw Error('1–500 ta savol bo‘lishi kerak');
 if(d.language&&d.language!=='uz')throw Error('Hozir faqat uz tili');
 const nums=new Set();for(const q of d.questions){if(!Number.isInteger(q.number)||nums.has(q.number))throw Error('Takror yoki noto‘g‘ri raqam');nums.add(q.number);
 if(typeof q.question!=='string'||!q.question.trim()||!q.options||['A','B','C','D'].some(k=>typeof q.options[k]!=='string'||!q.options[k].trim())||!['A','B','C','D'].includes(q.correct_answer))throw Error(q.number+'-savol to‘liq emas');}
 return d;
}
async function adminImportSave(){
 if(adminState.importBusy||!adminState.importData||!adminState.allowed||!client)return;
 const d=adminState.importData,selected=document.getElementById('ad-import-quiz')?.value||'',title=document.getElementById('ad-import-title')?.value.trim();
 const subject=(adminState.rows.subjects||[]).find(s=>s.title?.toLowerCase()===(d.subject||'').toLowerCase());
 if(!selected&&!subject){toast('Avval Fanlar bo‘limida Geografiya fanini yarating');return}
 if(!selected&&!title){toast('To‘plam nomini kiriting');return}
 if(!confirm(d.questions.length+' ta savol bazaga saqlansinmi?'))return;
 adminState.importBusy=true;let created=null;
 try{
 let quiz=selected;
 if(!quiz){const {data,error}=await client.from('edu_quizzes').insert({title,subject_id:subject.id,description:(d.category||'')+' · '+(d.source||''),time_limit:30,is_published:false}).select('id').single();if(error)throw error;quiz=data.id;created=quiz;}
 const {count,error:checkError}=await client.from('edu_questions').select('id',{count:'exact',head:true}).eq('quiz_id',quiz);
 if(checkError)throw checkError;if(count>0)throw Error('To‘plamda savollar bor. Takror yuklashdan saqlanish uchun bo‘sh to‘plamni tanlang.');
 const rows=d.questions.map(q=>({quiz_id:quiz,question:q.question.trim(),option_a:q.options.A.trim(),option_b:q.options.B.trim(),option_c:q.options.C.trim(),option_d:q.options.D.trim(),correct_option:q.correct_answer,explanation:'',sort_order:q.number}));
 const {error}=await client.from('edu_questions').insert(rows);if(error)throw error;
 adminState.importData=null;toast(rows.length+' ta savol saqlandi');await adminLoad();await eduRefreshCatalog(true);
 }catch(e){toast('Import xatosi: '+e.message);if(created)console.warn('Bo‘sh to‘plam ID:',created)}finally{adminState.importBusy=false;}
}
function adminBind(){
 const imp=document.getElementById('ad-import-file');if(imp)imp.onchange=async()=>{try{const f=imp.files?.[0];if(!f)return;if(f.size>2*1024*1024)throw Error('JSON 2 MB dan katta');adminState.importData=adminValidateImport(JSON.parse(await f.text()));document.getElementById('ad-import-preview').innerHTML=adminImportPreview();document.getElementById('ad-import-save').onclick=adminImportSave;toast(adminState.importData.questions.length+' ta savol tayyor');}catch(e){adminState.importData=null;document.getElementById('ad-import-preview').textContent=e.message;toast(e.message)}};
 const save=document.getElementById('ad-import-save');if(save)save.onclick=adminImportSave;

 app.querySelectorAll('[data-ad-tab]').forEach(b=>b.onclick=()=>{adminState.tab=b.dataset.adTab;adminState.search='';adminState.editing=null;render()});
 app.querySelectorAll('[data-ad-refresh]').forEach(b=>b.onclick=()=>adminLoad());
 const search=$('#ad-search');if(search)search.oninput=e=>{adminState.search=e.target.value;const cursor=search.selectionStart;render();$('#ad-search')?.focus();$('#ad-search')?.setSelectionRange(cursor,cursor)};
 const newBtn=app.querySelector('[data-ad-new]');if(newBtn)newBtn.onclick=()=>{adminState.editing={table:adminState.tab,row:{},id:null};render()};
 const cancel=app.querySelector('[data-ad-cancel]');if(cancel)cancel.onclick=()=>{adminState.editing=null;render()};
 app.querySelectorAll('[data-ad-edit]').forEach(b=>b.onclick=()=>{const row=adminState.rows[adminState.tab].find(x=>x.id===b.dataset.adEdit);if(row){adminState.editing={table:adminState.tab,id:row.id,row};render()}});
 app.querySelectorAll('[data-ad-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Ushbu yozuvni butunlay o‘chirasizmi?'))return;const table=adminState.tab;const {error}=await client.from('edu_'+table).delete().eq('id',b.dataset.adDelete);if(error)toast(error.message);else{toast('O‘chirildi');adminLoad();eduRefreshCatalog(true)}});
 const form=$('#ad-form');if(form)form.onsubmit=async e=>{
  e.preventDefault();const button=form.querySelector('[type=submit]');button.disabled=true;
  const table=adminState.tab,edit=adminState.editing,fd=new FormData(form),row={};
  for(const [key,label,type] of adminDefs[table].fields){let v=type==='checkbox'?form.elements[key].checked:fd.get(key);if(type==='number')v=v===''?0:Number(v);if(type==='subject_optional'&&v==='')v=null;if(type==='datetime-local')v=v?new Date(v).toISOString():null;row[key]=v}
  try{
   if(table==='books'&&$('#ad-pdf')?.files?.length){const file=$('#ad-pdf').files[0];if(file.type!=='application/pdf'||file.size>25*1024*1024)throw Error('PDF 25 MB dan oshmasligi kerak.');const path=verified.id+'/'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const result=await client.storage.from('eduone-books').upload(path,file,{contentType:'application/pdf'});if(result.error)throw result.error;row.file_path=path}
   const query=edit.id?client.from('edu_'+table).update(row).eq('id',edit.id):client.from('edu_'+table).insert(row);
   const {error}=await query;if(error)throw error;adminState.editing=null;toast('Muvaffaqiyatli saqlandi');await adminLoad();await eduRefreshCatalog(true);
  }catch(err){toast('Xatolik: '+err.message)}finally{button.disabled=false}
 };
}
const adminOriginalGo=go;
go=function(name,push=true){if(name==='admin'){if(!adminState.allowed){toast('Administrator huquqi yo‘q');return}adminState.tab='dashboard';adminLoad()}return adminOriginalGo(name,push)};

initialize();
